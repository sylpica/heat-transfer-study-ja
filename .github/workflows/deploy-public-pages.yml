name: Deploy approved public app to Pages

on:
  workflow_dispatch:
    inputs:
      approved_commit:
        description: Full 40-character SHA of the public source approved for deployment
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require an immutable approved source
        env:
          APPROVED_COMMIT: ${{ inputs.approved_commit }}
        run: '[[ "$APPROVED_COMMIT" =~ ^[0-9a-f]{40}$ ]]'
      - name: Check out approved public source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.approved_commit }}
      - name: Set up Node.js for build and tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked build and test dependencies
        run: npm ci
      - name: Run app tests
        run: npm test
      - name: Build allowlisted public distribution
        run: npm run build:public
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload public distribution
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
